<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Asia To Go: Daten zurückholen</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #1c1a17;
        color: #f2ede4;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 0 3rem;
        box-sizing: border-box;
      }
      main {
        max-width: 40rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 0.75rem;
        line-height: 1.45;
      }
      .muted {
        color: #b5aa9a;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 1.25rem 0;
      }
      li {
        padding: 0.25rem 0;
      }
      li[data-state="todo"] {
        color: #7d7468;
      }
      li[data-state="done"]::before {
        content: "✓ ";
      }
      li[data-state="running"]::before {
        content: "… ";
      }
      li[data-state="todo"]::before {
        content: "\00a0\00a0 ";
      }
      .box {
        border: 1px solid #e08a3e;
        background: rgba(224, 138, 62, 0.12);
        border-radius: 7px;
        padding: 0.75rem 1rem;
        margin: 1rem 0;
      }
      .fatal h1 {
        color: #ff8a80;
      }
      .buttons {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 1.25rem;
      }
      button {
        padding: 0.6rem 1rem;
        border-radius: 7px;
        border: 1px solid #3a352e;
        background: #262320;
        color: #f2ede4;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button.primary {
        background: #e08a3e;
        border-color: #e08a3e;
        color: #1c1a17;
        font-weight: 600;
      }
      button:focus-visible {
        outline: 2px solid #f2ede4;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main id="root" aria-live="polite"></main>
    <script>
      // Dumb renderer: main (restore-flow in main.ts) sends the state, built by
      // restore-screens.ts. textContent only, never innerHTML.
      const root = document.getElementById("root");

      function el(tag, text, attrs) {
        const node = document.createElement(tag);
        if (text) node.textContent = text;
        for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
        return node;
      }

      function render(state) {
        root.replaceChildren();
        root.className = state.phase === "result" ? state.screen.kind : "";
        if (state.phase === "progress") {
          root.append(el("h1", state.title), el("p", state.doNotClose, { class: "muted" }));
          const list = el("ul");
          for (const s of state.steps) list.append(el("li", s.label, { "data-state": s.state }));
          root.append(list);
          return;
        }
        const screen = state.screen;
        root.append(el("h1", screen.title));
        for (const line of screen.lines) root.append(el("p", line));
        if (screen.sync) {
          const box = el("div", null, { class: "box" });
          box.append(el("p", screen.sync.paused), el("p", screen.sync.explain, { class: "muted" }));
          root.append(box);
        }
        if (state.notice) root.append(el("p", state.notice, { class: "muted", role: "status" }));
        const row = el("div", null, { class: "buttons" });
        let focus = null;
        for (const b of screen.buttons) {
          const button = el("button", b.label, { type: "button", class: b.primary ? "primary" : "" });
          button.addEventListener("click", async () => {
            for (const other of row.querySelectorAll("button")) other.disabled = b.action !== "copyReport";
            await window.restoreUi.action(b.action);
            for (const other of row.querySelectorAll("button")) other.disabled = false;
          });
          if (b.action === screen.focus) focus = button;
          row.append(button);
        }
        root.append(row);
        if (focus) focus.focus();
      }

      window.restoreUi.onState(render);
    </script>
  </body>
</html>
