name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 11.20.0 (pinned via packageManager) requires Node 22.13+ — its
      # own CLI uses node:sqlite internally, which doesn't exist on Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js standalone output
        run: pnpm build

      # Must run before compiling — electron/tsconfig.json path-maps
      # embedded-postgres/electron-log's types to electron/app/node_modules,
      # so tsc fails to resolve them if this hasn't installed yet.
      - name: Install electron/app's own dependencies
        working-directory: electron/app
        run: npm ci

      # `prisma`'s own package pulls in MySQL/postgres.js drivers that
      # migrate deploy never touches (it talks to Postgres through the
      # native schema-engine binary, not a JS driver). Does NOT remove
      # @prisma/studio-core or @prisma/dev — both are required even for
      # non-studio/non-dev commands when running under Electron's Node
      # binary, see scripts/trim-electron-app-bloat.cjs for how that was
      # confirmed (both were tried and broke migrate deploy).
      - name: Trim unused Prisma driver bloat
        run: node scripts/trim-electron-app-bloat.cjs

      - name: Compile Electron main process
        run: pnpm run electron:build-src

      # Runs a real `prisma migrate deploy` against a throwaway embedded
      # Postgres instance to force-download Prisma's schema-engine binary and
      # bundle it into electron/resources/prisma-engines/ — without this, the
      # packaged app would need internet access on a fresh end-user machine
      # just to run its first migration. Also doubles as a migration smoke
      # test: a broken migration fails the release build here.
      - name: Prefetch and bundle Prisma schema-engine binary
        run: node scripts/ci-prefetch-prisma-engine.cjs

      - name: Build and publish installer
        run: node_modules/.bin/electron-builder --config electron-builder.config.js --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
