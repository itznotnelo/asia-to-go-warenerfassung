<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <title>Asia To Go</title>
    <style>
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #1c1a17;
        color: #f2ede4;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        font-size: 0.85rem;
        color: #b5aa9a;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin-bottom: 1.25rem;
        border: 3px solid #3a352e;
        border-top-color: #e08a3e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <h1>Asia To Go wird gestartet…</h1>
    <p>Beim ersten Start kann dies etwas länger dauern.</p>
  </body>
</html>
