services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: asia_shop
      POSTGRES_PASSWORD: asia_shop
      POSTGRES_DB: asia_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asia_shop -d asia_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
